# L'ordonnanceur : un processus séparé, une seule réplique.
#
# ─────────────────────────────────────────────────────────────────────────────
# POURQUOI SÉPARÉ DE L'API
#
# Les cinq travaux ne servent aucune requête. Les faire tourner dans les
# processus qui servent le trafic mêle deux charges qui n'ont ni le même profil
# ni le même risque : la réconciliation appelle le réseau et peut durer, le
# relais écrit en base toutes les cinq secondes, et un pic de trafic d'adhérents
# ne doit ni retarder un encaissement ni en être retardé.
#
# Séparés, l'API grandit avec le trafic et l'ordonnanceur reste à un.
#
# ⚠️ `replicas: 1`, ET POURTANT DEUX SERAIENT CORRECTS
#
# Le verrou consultatif — `pg_try_advisory_xact_lock`, transactionnel, relâché à
# la validation — garantit qu'un travail ne s'exécute que dans une instance à la
# fois. Deux répliques ne produiraient donc **rien de faux** : elles se
# réveilleraient toutes les cinq secondes pour que l'une obtienne le verrou et
# que l'autre reparte.
#
# C'est précisément ce qui rend la mise à jour progressive sûre : pendant le
# recouvrement de l'ancien et du nouveau pod, les deux tournent, et la
# correction ne dépend d'aucune coordination. `maxSurge: 1` est donc admis ici,
# là où beaucoup de déploiements de tâches de fond exigent `Recreate`.
#
# ⚠️ Une seule réplique reste le réglage voulu : le gain est nul, et deux pods
# qui contendent quatre-vingt-six mille fois par jour pour un verrou produisent
# du bruit dans les journaux qu'on finit par cesser de lire.
#
# ⚠️ CE POD N'A PAS DE SONDE DE DISPONIBILITÉ, ET C'EST NORMAL : il ne sert
# aucun trafic, aucun `Service` ne le désigne. Lui en donner une ferait croire
# qu'il entre dans une file de routage.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cga-ordonnanceur
  namespace: cga
  labels:
    app.kubernetes.io/name: cga
    app.kubernetes.io/component: ordonnanceur
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cga
      app.kubernetes.io/component: ordonnanceur
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cga
        app.kubernetes.io/component: ordonnanceur
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ordonnanceur
          image: cga/backend:REMPLACER-PAR-UNE-ETIQUETTE-IMMUABLE
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: cga-configuration
            - secretRef:
                name: cga-secrets
          env:
            # ⚠️ **La seule différence avec l'API.** Les deux processus portent
            # le même code et la même configuration ; ce drapeau dit lequel fait
            # tourner la boucle de fond.
            #
            # Le sortir dans un `ConfigMap` distinct aurait dupliqué quinze
            # valeurs pour en changer une, et la quinzième aurait fini par
            # diverger.
            - name: CGA_ORDONNANCEUR_EN_PROCESSUS
              value: "true"
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: fichiers
              mountPath: /application/fichiers
          resources:
            requests: {cpu: "100m", memory: "384Mi"}
            limits: {memory: "768Mi"}
      volumes:
        - name: fichiers
          persistentVolumeClaim:
            claimName: cga-fichiers-deposes
