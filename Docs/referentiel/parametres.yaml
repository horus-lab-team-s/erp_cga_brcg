# Référentiel normatif — paramètres fiscaux datés
#
# ┌────────────────────────────────────────────────────────────────────────────┐
# │  AVERTISSEMENT                                                             │
# │                                                                            │
# │  Aucune valeur de ce fichier n'a été validée sur le Code Général des       │
# │  Impôts. Toutes proviennent de sources secondaires : document de cadrage,  │
# │  dossier de design, maquettes. Elles sont au statut A_VALIDER.             │
# │                                                                            │
# │  Le fiscaliste du cabinet doit confirmer chaque valeur sur le texte        │
# │  officiel (CGI en vigueur + loi de finances de l'année + circulaire        │
# │  d'application MINFI/DGI) avant toute mise en production, et renseigner    │
# │  statut: VALIDE, valide_par et valide_le.                                  │
# └────────────────────────────────────────────────────────────────────────────┘
#
# Format d'une version :
#   valeur          scalaire ou chaîne
#   applicable_du   date d'entrée en vigueur (bornes : [du, au[ — au exclu)
#   applicable_au   null = toujours en vigueur
#   statut          A_VALIDER | VALIDE | ABROGE
#   fondement       texte + source, OBLIGATOIRE
#   note            précision, divergence de sources, réserve
#
# Un paramètre sans version applicable à la date demandée lève une erreur.
# Il ne rend jamais de valeur par défaut : une valeur légale silencieusement
# absente est un bug fiscal.

version_referentiel: "2026.1"
mis_a_jour_le: 2026-08-09

parametres:

  # ── TVA ────────────────────────────────────────────────────────────────────

  - code: TVA_TAUX_GENERAL
    libelle: Taux général de la TVA, centimes additionnels communaux inclus
    categorie: TVA
    unite: POURCENTAGE
    versions:
      - valeur: 19.25
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: Taux de 17,5 % majoré de 10 % de centimes additionnels communaux
          source: Document de cadrage § 2.3 ; dossier de design § 3
        note: >-
          Décomposition à confirmer. Certaines sources traitent le CAC comme une
          taxe distincte et non comme une majoration du taux.

  - code: TVA_TAUX_BASE_HORS_CAC
    libelle: Taux de TVA hors centimes additionnels communaux
    categorie: TVA
    unite: POURCENTAGE
    versions:
      - valeur: 17.5
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: Taux nominal de la TVA
          source: Document de cadrage § 2.3

  - code: CAC_TAUX
    libelle: Taux des centimes additionnels communaux
    categorie: TVA
    unite: POURCENTAGE
    versions:
      - valeur: 10
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: Majoration de 10 % appliquée à la TVA et à l'IS
          source: Document de cadrage § 2.3

  - code: SEUIL_ASSUJETTISSEMENT_TVA
    libelle: Chiffre d'affaires annuel au-delà duquel l'assujettissement à la TVA est dû
    categorie: TVA
    unite: FCFA
    versions:
      - valeur: 50000000
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: Seuil d'assujettissement fréquemment cité à 50 000 000 FCFA
          source: Document de cadrage § 2.3
        note: À confirmer, notamment au regard de la refonte des régimes par la LF 2025.

  # ── Déductibilité ──────────────────────────────────────────────────────────

  - code: SEUIL_ESPECES_DEDUCTIBILITE_TVA
    libelle: >-
      Montant à partir duquel un règlement en espèces exclut la déduction de la TVA
    categorie: DEDUCTIBILITE
    unite: FCFA
    versions:
      - valeur: 500000
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: CGI art. 143
          source: Maquettes — constat FAC-ACH-007 du prototype cliquable
        note: >-
          DIVERGENCE DE SOURCES, FACTEUR CINQ. Le document de cadrage § 2.4 énonce
          un seuil de 100 000 FCFA ; les maquettes validées par le cabinet retiennent
          500 000 FCFA en citant le CGI art. 143. La valeur des maquettes est retenue
          par défaut car elle a été vue et validée visuellement par le cabinet.
          À TRANCHER SUR LE TEXTE — voir Docs/architecture/09-questions-ouvertes.md Q1.
          La règle FAC-ACH-007 est celle qui produit le plus gros enjeu du portefeuille.

  - code: DELAI_DROIT_DEDUCTION_EXERCICES
    libelle: >-
      Nombre d'exercices suivant celui de l'exigibilité pendant lesquels le droit à
      déduction reste exerçable
    categorie: DEDUCTIBILITE
    unite: EXERCICES
    versions:
      - valeur: 2
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: Droit à déduction exerçable jusqu'à la fin du deuxième exercice suivant
          source: Document de cadrage § 2.4

  # ── Régimes ────────────────────────────────────────────────────────────────

  - code: SEUIL_COMPTABILITE_OBLIGATOIRE
    libelle: >-
      Chiffre d'affaires à partir duquel la tenue d'une comptabilité est légalement
      obligatoire
    categorie: REGIME
    unite: FCFA
    versions:
      - valeur: 10000000
        applicable_du: 2026-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: >-
            LF 2026 — obligation de tenir une comptabilité dès 10 M FCFA de chiffre
            d'affaires, référence explicite au SMT OHADA, DSF obligatoire
          source: Document de cadrage § 2.2

  - code: IGS_PERIODE_PROBATOIRE_EXERCICES
    libelle: >-
      Nombre d'exercices de période probatoire avant retour éventuel à l'IGS après
      reclassement pour dépassement de seuil
    categorie: REGIME
    unite: EXERCICES
    versions:
      - valeur: 2
        applicable_du: 2026-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: LF 2026 — mécanisme de reclassement automatique et période probatoire
          source: Document de cadrage § 2.2

  - code: ABATTEMENT_CGA_BENEFICE
    libelle: Abattement sur le bénéfice déclaré ouvert par l'adhésion à un CGA
    categorie: AVANTAGE_CGA
    unite: POURCENTAGE
    versions:
      - valeur: 50
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: Avantage fiscal attaché à l'adhésion à un Centre de Gestion Agréé
          source: Document de cadrage § 1.1 ; CCIMA
        note: >-
          Conditions d'application à préciser : plafond éventuel, régimes concernés,
          délai de carence après adhésion.

  - code: PRECOMPTE_REDUCTION_ADHERENT_CGA
    libelle: Réduction du taux de précompte sur achats pour un adhérent CGA
    categorie: AVANTAGE_CGA
    unite: POURCENTAGE
    versions:
      - valeur: 50
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: Taux de précompte réduit de moitié pour les adhérents d'un CGA
          source: Document de cadrage § 4.3, catégorie 6

  # ── Délais déclaratifs ─────────────────────────────────────────────────────

  - code: TVA_JOUR_LIMITE_DEPOT
    libelle: Jour du mois suivant avant lequel la déclaration de TVA doit être déposée
    categorie: ECHEANCE
    unite: JOUR_DU_MOIS
    versions:
      - valeur: 15
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: >-
            Déclaration au plus tard le 15 du mois suivant, y compris déclaration néant
          source: Document de cadrage § 2.3
        note: >-
          Le jour est un paramètre, mais la date d'échéance reste CALCULÉE à partir du
          type d'obligation et du centre de rattachement. Ne jamais figer une date.

  - code: CNPS_JOUR_LIMITE_PAIEMENT
    libelle: Jour du mois suivant avant lequel les cotisations CNPS doivent être payées
    categorie: ECHEANCE
    unite: JOUR_DU_MOIS
    versions:
      - valeur: 15
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: Déclaration DIPE mensuelle, paiement au plus tard le 15 du mois suivant
          source: Document de cadrage § 2.3

  - code: DSF_DELAI_JOURS_APRES_CLOTURE
    libelle: >-
      Délai en jours après la clôture de l'exercice pour le dépôt de la Déclaration
      Statistique et Fiscale
    categorie: ECHEANCE
    unite: JOURS
    versions:
      - valeur: 75
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: >-
            15 mars pour un exercice clos au 31 décembre, soit 75 jours après clôture
          source: Document de cadrage § 2.3
        note: >-
          Le dépôt est historiquement échelonné selon le rattachement DGE / CIME / CDI.
          L'échelonnement doit devenir un paramètre par centre, pas une constante.

  # ── Pénalités ──────────────────────────────────────────────────────────────

  - code: PENALITE_RETARD_TAUX_FIXE
    libelle: Pénalité fixe pour dépôt ou paiement tardif, en pourcentage du montant dû
    categorie: PENALITE
    unite: POURCENTAGE
    versions:
      - valeur: 25
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: Pénalité usuellement citée à 25 % du montant dû
          source: Document de cadrage § 2.3

  - code: PENALITE_RETARD_TAUX_MENSUEL
    libelle: Majoration par mois de retard, en pourcentage du montant dû
    categorie: PENALITE
    unite: POURCENTAGE
    versions:
      - valeur: 1.5
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: Majoration usuellement citée à 1,5 % par mois de retard
          source: Document de cadrage § 2.3

  # ── Formats d'identifiant ──────────────────────────────────────────────────

  - code: FORMAT_NIU
    libelle: Expression régulière du numéro d'identifiant unique
    categorie: FORMAT
    unite: REGEX
    versions:
      - valeur: '^[A-Z][0-9]{12}[A-Z]$'
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: >-
            Une lettre, douze caractères — exemples P019876543210K, M081234567890P
          source: Dossier de design § 4 et § 13.3
        note: >-
          Le § 4 énonce « une lettre, douze caractères » mais les exemples comptent
          quatorze caractères : une lettre, douze chiffres, une lettre. Le format retenu
          suit les exemples, qui sont cohérents entre eux sur les six entreprises du
          jeu de démonstration. À confirmer auprès de la DGI.

  - code: FORMAT_RCCM
    libelle: Expression régulière du numéro du registre du commerce et du crédit mobilier
    categorie: FORMAT
    unite: REGEX
    versions:
      - valeur: '^RC/[A-Z]{3}/[0-9]{4}/[A-Z]/[0-9]{4}$'
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: Format greffe — exemple RC/DLA/2019/A/1842
          source: Dossier de design § 4 et § 13.3

  - code: REGEX_DESIGNATION_IMPRECISE
    libelle: >-
      Expression régulière des désignations de ligne jugées trop imprécises pour
      identifier la nature du bien ou de la prestation
    categorie: FORMAT
    unite: REGEX
    versions:
      - valeur: '(?i)^\s*(divers|travaux\s+divers|prestations?|fournitures?|services?|articles?|marchandises?)\s*$'
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: >-
            CGI art. 150 (5) — la désignation doit permettre d'identifier la nature du
            bien ou du service
          source: Document de cadrage § 4.3, catégorie 4
        note: >-
          Liste de calibrage, à enrichir par le fiscaliste au vu des factures réelles.
          La règle FAC-DOC-011 est écartée à 42 % dans le jeu de démonstration.

  # ── Vraisemblance ──────────────────────────────────────────────────────────

  - code: DOUBLON_FENETRE_JOURS
    libelle: >-
      Fenêtre en jours dans laquelle deux factures de même fournisseur et même montant
      sont signalées comme doublon possible
    categorie: VRAISEMBLANCE
    unite: JOURS
    versions:
      - valeur: 15
        applicable_du: 2026-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: Paramètre de contrôle interne, sans fondement légal
          source: Réglage du cabinet
        note: >-
          Paramètre de calibrage, pas une valeur légale. La règle FAC-VRA-005 est
          écartée à 68 % dans le jeu de démonstration : elle est trop bruyante et cette
          fenêtre est le premier levier de recalibrage.
